<div id="loading" class="loading-page">
  <div class="loader-emblem" aria-hidden="true"><img src="images/crest.png" alt="" width="48" height="56" /></div>
  <span data-loading-message>Checking your session…</span>
  <button type="button" class="loading-retry-btn" data-loading-retry>Try again</button>
</div>

<script>
  // Watchdog for the session check below: runs immediately, with no
  // imports and no network dependency of its own, so it can't get stuck
  // on the same thing the main module script might get stuck on. This
  // covers the case the getSessionOrTimeout() safety net in page-shared.js
  // can't: a full page reload (e.g. the OS discarded this tab while the
  // app was minimised, then reloaded it on return) where the ES module
  // imports themselves - fetched fresh over the network - are what hangs,
  // before any of our own code has had a chance to run.
  (function () {
    setTimeout(function () {
      var appEl = document.getElementById('app');
      var loadingEl = document.getElementById('loading');
      if (!loadingEl || (appEl && appEl.style.display !== 'none')) return;
      if (loadingEl.classList.contains('is-error')) return;
      var msg = loadingEl.querySelector('[data-loading-message]');
      if (msg) msg.textContent = "Couldn't check your session. Check your connection and try again.";
      loadingEl.classList.add('is-error');
      var retryBtn = loadingEl.querySelector('[data-loading-retry]');
      if (retryBtn) retryBtn.addEventListener('click', function () { window.location.reload(); });
    }, 10000);
  })();
</script>

<script type="module">
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
  import { cachedFetch, invalidateCacheKey } from './cache.js';
  import {
    setupDrawer, setupRefreshAndSignOut, registerServiceWorker,
    loadNoticeBadge, loadActiveStatus, escapeHtml, linkifyText,
    locationButtonsHtml, locationMapBoxHtml, handleShowMapClick,
    loadMyPlayers, resolveSelectedPlayer,
    getSessionOrTimeout, showSessionCheckError,
    updateShopNav, setupNavigationFeedback, setupStickyHeader,
  } from './page-shared.js';

  const loading = document.getElementById('loading');
  const app = document.getElementById('app');

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    loading.textContent = 'This app has no Supabase connection configured yet.';
    throw new Error('Missing Supabase config');
  }

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let data;
  try {
    ({ data } = await getSessionOrTimeout(supabase));
  } catch (err) {
    showSessionCheckError(loading);
    throw err;
  }
  if (!data.session) {
    window.location.href = 'index.html';
  } else {
    loading.style.display = 'none';
    app.style.display = 'block';
    const uid = data.session.user.id;
    const accessToken = data.session.access_token;

    setupDrawer();
    setupRefreshAndSignOut(supabase, uid);
    registerServiceWorker();

    // Notices are deliberately a single combined feed across every linked
    // child (see get-my-notices) - no switcher on this page. The Loyalty
    // nav item's visibility still needs to reflect ONE child's active
    // status though, so it uses whichever child is currently selected
    // elsewhere in the app (persisted from home/profile/fixtures).
    let players = [];
    try {
      const playersBody = await loadMyPlayers(SUPABASE_URL, accessToken, uid);
      players = playersBody.players || [];
    } catch (err) {
      // Fall through - active-status check below still works for the
      // common single-child case even with an empty players list.
    }
    const selectedPlayerId = resolveSelectedPlayer(uid, players);

    loadNoticeBadge(SUPABASE_URL, accessToken, uid);
    updateShopNav(SUPABASE_URL, accessToken, uid);
    setupNavigationFeedback();
    setupStickyHeader();
    if (selectedPlayerId) loadActiveStatus(SUPABASE_URL, accessToken, uid, selectedPlayerId);
    loadNotices(accessToken, uid, players.length > 1);
  }

  async function loadNotices(accessToken, userId, showChildTags) {
    const noticesLoading = document.getElementById('notices-loading');
    const noticesError = document.getElementById('notices-error');
    const noticesEmpty = document.getElementById('notices-empty');
    const noticesList = document.getElementById('notices-list');

    try {
      const body = await cachedFetch(userId, 'get-my-notices', async () => {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/get-my-notices`, {
          headers: { Authorization: `Bearer ${accessToken}` },
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Could not load notices');
        return json;
      });

      noticesLoading.style.display = 'none';

      if (!body.notices || body.notices.length === 0) {
        noticesEmpty.style.display = 'block';
        return;
      }

      const dateFmt = (d) =>
        new Date(d).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' });

      const categoryLabel = { training: 'Training', announcement: 'Announcement' };

      noticesList.innerHTML = body.notices
        .map((n) => `
          <div class="card" data-notice-id="${n.id}" data-read="${n.is_read ? '1' : '0'}">
            ${n.pinned ? `<span class="pill" style="margin-bottom:8px;">Pinned</span>` : ''}
            <p class="fixture-teams" style="margin-bottom:4px; display:flex; align-items:center; gap:8px;">
              ${!n.is_read ? '<span class="unread-dot"></span>' : ''}${escapeHtml(n.title)}
            </p>
            <p class="fixture-when" style="margin-bottom:10px;">
              ${categoryLabel[n.category] || 'Announcement'} · ${dateFmt(n.posted_at)}
              ${showChildTags && n.for_children && n.for_children.length
                ? ' · For ' + n.for_children.map((c) => escapeHtml(c.name)).join(', ')
                : ''}
            </p>
            <p style="color: var(--ink); font-size: 14px; line-height:1.5; margin:0; white-space: pre-wrap; overflow-wrap: anywhere;">${linkifyText(n.body)}</p>
            ${locationButtonsHtml(n, `notice-${n.id}`)
              ? `<div class="fixture-actions">${locationButtonsHtml(n, `notice-${n.id}`)}</div>${locationMapBoxHtml(n, `notice-${n.id}`)}`
              : ''}
          </div>
        `)
        .join('');
      noticesList.onclick = (e) => { handleShowMapClick(e, noticesList); };

      setupReadTracking(accessToken, userId);
    } catch (err) {
      noticesLoading.style.display = 'none';
      noticesError.textContent = err.message;
      noticesError.classList.add('visible');
      noticesError.style.display = 'block';
    }
  }

  // Marks a notice as read once its card has been genuinely visible on
  // screen for a moment - not just rendered, since everything renders
  // at once on page load. A short dwell time (600ms) avoids marking
  // things read from a quick scroll-past.
  function setupReadTracking(accessToken, userId) {
    const pendingTimers = new Map();

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const card = entry.target;
        const noticeId = card.dataset.noticeId;

        if (entry.isIntersecting) {
          if (card.dataset.read === '1' || pendingTimers.has(noticeId)) return;
          const timer = setTimeout(() => {
            markNoticeRead(noticeId, accessToken, userId);
            card.dataset.read = '1';
            const dot = card.querySelector('.unread-dot');
            if (dot) dot.remove();
            observer.unobserve(card);
            pendingTimers.delete(noticeId);
          }, 600);
          pendingTimers.set(noticeId, timer);
        } else {
          const timer = pendingTimers.get(noticeId);
          if (timer) {
            clearTimeout(timer);
            pendingTimers.delete(noticeId);
          }
        }
      });
    }, { threshold: 0.6 });

    document.querySelectorAll('#notices-list .card[data-read="0"]').forEach((card) => {
      observer.observe(card);
    });
  }

  async function markNoticeRead(noticeId, accessToken, userId) {
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/mark-notice-read`, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ notice_id: noticeId }),
      });
      if (res.ok) {
        // Both cached reads are now stale (the notice is read, the count
        // dropped) - bust them so the next load reflects it immediately
        // rather than waiting for the next scheduled refresh.
        invalidateCacheKey(userId, 'get-my-notices');
        invalidateCacheKey(userId, 'get-my-notice-count');
      }
    } catch (err) {
      // Non-critical - worst case the notice just shows unread again next visit.
    }
  }


</script>
