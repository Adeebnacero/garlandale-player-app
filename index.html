<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Garlandale FC Player Portal — Sign in</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#241a45" />
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<link rel="icon" type="image/png" href="icons/favicon.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="styles.css" />
<script>
  // Android announces "this app can be installed" once, early; keep it for
  // the Install button (see install.js).
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__gfcInstallPrompt = e;
    window.dispatchEvent(new Event('gfc-installable'));
  });
</script>
</head>
    <script defer src="/_vercel/insights/script.js"></script>
<body class="login-page">

<div class="login-box">
  <div id="install-notice"></div>
<div id="config-warning" class="config-warning" style="display:none;">
    This app isn't connected to a Supabase project yet — fill in
    <code>config.js</code> with your Project URL and anon key.
  </div>

  <div id="login-error" class="login-error"></div>

  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" required />
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" required />
    <button type="submit" id="submit-btn">Sign in</button>
  </form>
  <p class="forgot-link"><a href="reset-password.html" id="forgot-link">Forgot password?</a></p>

  <div class="join-divider">New here?</div>
  <a class="join-button" href="signup.html">Join as a supporter</a>

  <p class="login-note">
    Players and guardians: use the email your coach or the club sent your invite to.
  </p>
</div>

<script type="module">
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
  import { renderSignInNotice } from './install.js';

  // Opened inside WhatsApp, Facebook etc.? Point people at Chrome/Safari
  // before they sign in, so they only sign in once, in the right browser.
  renderSignInNotice(document.getElementById('install-notice'));

  const configWarning = document.getElementById('config-warning');
  const loginError = document.getElementById('login-error');
  const form = document.getElementById('login-form');
  const submitBtn = document.getElementById('submit-btn');

  const configured = SUPABASE_URL && SUPABASE_ANON_KEY;
  if (!configured) {
    configWarning.style.display = 'block';
  }

  const supabase = configured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  // Prefill the email field when arriving from the Club Management app's
  // post-invite "where would you like to go" chooser, so the person only
  // has to type their password here.
  const prefillEmail = new URLSearchParams(window.location.search).get('email');
  if (prefillEmail) {
    document.getElementById('email').value = prefillEmail;
    document.getElementById('password').focus();
  }

  // "Forgot password?" carries over an email already typed in.
  document.getElementById('forgot-link').addEventListener('click', (e) => {
    const typed = document.getElementById('email').value.trim();
    if (typed) { e.preventDefault(); window.location.href = `reset-password.html?email=${encodeURIComponent(typed)}`; }
  });

  // After a supporter deletes their account.
  if (new URLSearchParams(window.location.search).get('deleted')) {
    loginError.textContent = 'Your account has been deleted.';
    loginError.classList.add('visible', 'is-info');
  }

  // If already signed in, skip straight to the dashboard.
  if (supabase) {
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = 'home.html';
    });
  }

  function showError(message) {
    loginError.textContent = message;
    loginError.classList.add('visible');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.classList.remove('visible');

    if (!configured) {
      showError('This app has no Supabase connection configured yet.');
      return;
    }

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showError(
        error.message === 'Invalid login credentials'
          ? 'Incorrect email or password.'
          : /email not confirmed/i.test(error.message)
            ? 'Please confirm your email address first: tap the link in the email we sent you.'
            : error.message
      );
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
      return;
    }

    window.location.href = 'home.html';
  });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
</script>

</body>
</html>
