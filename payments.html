<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Garlandale FC Player Portal — Payment History</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#241a45" />
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<link rel="icon" type="image/png" href="icons/favicon.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
  <script defer src="/_vercel/insights/script.js"></script>
<body class="home-page">

<div id="loading" class="loading-page">
  <div class="loader-emblem" aria-hidden="true"><img src="images/crest.png" alt="" width="48" height="56" /></div>
  <span data-loading-message>Checking your session…</span>
  <button type="button" class="loading-retry-btn" data-loading-retry>Try again</button>
</div>

<script>
  // Watchdog for the session check below: runs immediately, with no
  // imports and no network dependency of its own, so it can't get stuck
  // on the same thing the main module script might get stuck on. This
  // covers the case the getSessionOrTimeout() safety net in page-shared.js
  // can't: a full page reload (e.g. the OS discarded this tab while the
  // app was minimised, then reloaded it on return) where the ES module
  // imports themselves - fetched fresh over the network - are what hangs,
  // before any of our own code has had a chance to run.
  (function () {
    setTimeout(function () {
      var appEl = document.getElementById('app');
      var loadingEl = document.getElementById('loading');
      if (!loadingEl || (appEl && appEl.style.display !== 'none')) return;
      if (loadingEl.classList.contains('is-error')) return;
      var msg = loadingEl.querySelector('[data-loading-message]');
      if (msg) msg.textContent = "Couldn't check your session. Check your connection and try again.";
      loadingEl.classList.add('is-error');
      var retryBtn = loadingEl.querySelector('[data-loading-retry]');
      if (retryBtn) retryBtn.addEventListener('click', function () { window.location.reload(); });
    }, 10000);
  })();
</script>

<div id="app" style="display:none;">
  <header class="drilldown-header">
    <a href="home.html" class="back-btn" aria-label="Back to Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span class="drilldown-title">Payment history</span>
    <span style="width:22px"></span>
  </header>

  <main>
    <div class="child-tabs" id="child-tabs" style="display:none;"></div>

    <div id="payments-loading" style="color: var(--inkSoft); font-size: 14px;"><span class="spinner-inline" aria-hidden="true"></span>Loading payment history&hellip;</div>
    <div id="payments-error" class="login-error" style="display:none;"></div>
    <div id="payments-empty" style="display:none; color: var(--inkSoft); font-size: 14px; text-align:center; padding: 24px 0;">
      No payments to date.
    </div>
    <div id="payments-list"></div>
  </main>
</div>

<script type="module">
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
  import { cachedFetch } from './cache.js';
  import {
    registerServiceWorker,
    loadMyPlayers, resolveSelectedPlayer, setSelectedPlayer, renderChildSwitcher,
    getSessionOrTimeout, showSessionCheckError, setupNavigationFeedback,
  } from './page-shared.js';

  const loading = document.getElementById('loading');
  const app = document.getElementById('app');

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    loading.textContent = 'This app has no Supabase connection configured yet.';
    throw new Error('Missing Supabase config');
  }

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let data;
  try {
    ({ data } = await getSessionOrTimeout(supabase));
  } catch (err) {
    showSessionCheckError(loading);
    throw err;
  }
  if (!data.session) {
    window.location.href = 'index.html';
  } else {
    loading.style.display = 'none';
    app.style.display = 'block';
    const uid = data.session.user.id;
    const accessToken = data.session.access_token;

    registerServiceWorker();
    setupNavigationFeedback();

    let players = [];
    try {
      const playersBody = await loadMyPlayers(SUPABASE_URL, accessToken, uid);
      players = playersBody.players || [];
    } catch (err) {
      // Fall through - loadPayments below still works for the common
      // single-child case even with an empty players list.
    }

    let selectedPlayerId = resolveSelectedPlayer(uid, players);

    const childTabs = document.getElementById('child-tabs');
    function onSelectChild(newPlayerId) {
      selectedPlayerId = newPlayerId;
      setSelectedPlayer(uid, selectedPlayerId);
      renderChildSwitcher(childTabs, players, selectedPlayerId, onSelectChild);
      loadPayments(accessToken, uid, selectedPlayerId);
    }
    renderChildSwitcher(childTabs, players, selectedPlayerId, onSelectChild);

    loadPayments(accessToken, uid, selectedPlayerId);
  }

  async function loadPayments(accessToken, userId, playerId) {
    const paymentsLoading = document.getElementById('payments-loading');
    const paymentsError = document.getElementById('payments-error');
    const paymentsEmpty = document.getElementById('payments-empty');
    const paymentsList = document.getElementById('payments-list');

    paymentsLoading.style.display = 'block';
    paymentsError.classList.remove('visible');
    paymentsError.style.display = 'none';
    paymentsEmpty.style.display = 'none';
    paymentsList.innerHTML = '';

    try {
      const body = await cachedFetch(userId, `get-my-payments:${playerId}`, async () => {
        const res = await fetch(
          `${SUPABASE_URL}/functions/v1/get-my-payments?player_id=${encodeURIComponent(playerId)}`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Could not load payment history');
        return json;
      });

      paymentsLoading.style.display = 'none';

      if (!body.payments || body.payments.length === 0) {
        paymentsEmpty.style.display = 'block';
        return;
      }

      const money = (n) =>
        'R' + Math.abs(n).toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const dayFmt = (d) =>
        new Date(d + 'T00:00:00').toLocaleDateString('en-ZA', { weekday: 'short', day: 'numeric', month: 'short' });
      const monthFmt = (d) =>
        new Date(d + 'T00:00:00').toLocaleDateString('en-ZA', { month: 'long', year: 'numeric' });

      let html = '';
      let currentMonth = null;
      for (const p of body.payments) {
        const monthLabel = monthFmt(p.date);
        if (monthLabel !== currentMonth) {
          currentMonth = monthLabel;
          html += `<p class="payment-month-heading">${monthLabel}</p>`;
        }
        html += `
          <div class="card payment-row">
            <div>
              <p class="payment-amount">${money(p.amount)}</p>
              <p class="payment-meta">${dayFmt(p.date)} &middot; ${p.method || 'Unknown method'}</p>
            </div>
          </div>
        `;
      }
      paymentsList.innerHTML = html;
    } catch (err) {
      paymentsLoading.style.display = 'none';
      paymentsError.textContent = err.message;
      paymentsError.classList.add('visible');
      paymentsError.style.display = 'block';
    }
  }
</script>

</body>
</html>
