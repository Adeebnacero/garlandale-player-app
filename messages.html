<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Garlandale FC Player Portal — Messages</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#241a45" />
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<link rel="icon" type="image/png" href="icons/favicon.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
  <script defer src="/_vercel/insights/script.js"></script>
<body class="home-page">

<div id="loading" class="loading-page">
  <div class="loader-emblem" aria-hidden="true"><img src="images/crest.png" alt="" width="48" height="56" /></div>
  <span data-loading-message>Checking your session…</span>
  <button type="button" class="loading-retry-btn" data-loading-retry>Try again</button>
</div>

<script>
  // Watchdog for the session check below: runs immediately, with no
  // imports and no network dependency of its own, so it can't get stuck
  // on the same thing the main module script might get stuck on. This
  // covers the case the getSessionOrTimeout() safety net in page-shared.js
  // can't: a full page reload (e.g. the OS discarded this tab while the
  // app was minimised, then reloaded it on return) where the ES module
  // imports themselves - fetched fresh over the network - are what hangs,
  // before any of our own code has had a chance to run.
  (function () {
    setTimeout(function () {
      var appEl = document.getElementById('app');
      var loadingEl = document.getElementById('loading');
      if (!loadingEl || (appEl && appEl.style.display !== 'none')) return;
      if (loadingEl.classList.contains('is-error')) return;
      var msg = loadingEl.querySelector('[data-loading-message]');
      if (msg) msg.textContent = "Couldn't check your session. Check your connection and try again.";
      loadingEl.classList.add('is-error');
      var retryBtn = loadingEl.querySelector('[data-loading-retry]');
      if (retryBtn) retryBtn.addEventListener('click', function () { window.location.reload(); });
    }, 10000);
  })();
</script>

<div id="app" style="display:none;">
  <header class="drilldown-header">
    <a href="home.html" class="back-btn" aria-label="Back to Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span class="drilldown-title">Messages</span>
    <span style="width:22px"></span>
  </header>
  <main>
    <div id="msg-loading" style="color: var(--inkSoft); font-size: 14px;"><span class="spinner-inline" aria-hidden="true"></span>Loading messages&hellip;</div>
    <div id="msg-error" class="login-error" style="display:none;"></div>
    <div id="msg-empty" class="msg-empty" style="display:none;">
      No messages yet. Personal messages from the club, like payment reminders, will appear here.
    </div>
    <div id="msg-filter" class="msg-filter" role="group" aria-label="Show messages about" style="display:none;"></div>
    <div id="msg-list" aria-live="polite"></div>
    <p id="msg-kept" class="msg-kept" style="display:none;">Messages are kept for 90 days.</p>
  </main>
</div>
<script type="module">
  // Messages: private messages from the club about this guardian's own
  // children (Club Management -> Player Messages -> "Send in app"). Opened
  // from the side panel, or straight from a phone notification. Always
  // loads fresh. Messages shown here are marked read, which clears the
  // header and side-panel counts, and shows as "Read" to the club.
  //
  // Layout: the last 7 days in full; older messages grouped by month in
  // folded sections of one-line previews that open in place. A group with
  // an unread message starts open, with that message opened, so nothing
  // new is ever hidden. Guardians with messages about more than one child
  // get All / child buttons at the top. Grouping: messages-view.js.
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
  import {
    registerServiceWorker, getSessionOrTimeout, showSessionCheckError,
    setupNavigationFeedback, setupStickyHeader, escapeHtml, markMessagesNavRead,
  } from './page-shared.js';
  import { supporterGate } from './supporter.js';
  import { childrenIn, filterByChild, groupMessages } from './messages-view.js';

  const loading = document.getElementById('loading');
  const app = document.getElementById('app');
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    loading.textContent = 'This app has no Supabase connection configured yet.';
    throw new Error('Missing Supabase config');
  }

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let data;
  try {
    ({ data } = await getSessionOrTimeout(supabase));
  } catch (err) {
    showSessionCheckError(loading);
    throw err;
  }
  if (!data.session) {
    window.location.href = 'index.html';
  } else {
    loading.style.display = 'none';
    app.style.display = 'block';
    const uid = data.session.user.id;
    const accessToken = data.session.access_token;

    registerServiceWorker();
    setupNavigationFeedback();
    setupStickyHeader();

    // Messages are about players; supporters go back to Home.
    const gate = await supporterGate(SUPABASE_URL, accessToken, uid);
    if (gate.supporter) window.location.replace('home.html');
    else loadMessages(accessToken, uid);
  }

  function when(iso) {
    return new Date(iso).toLocaleString('en-ZA', {
      weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
      timeZone: 'Africa/Johannesburg',
    });
  }

  // ---- Rendering ----
  const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const view = { messages: [], showChild: false, child: '', openGroups: new Set(), openRows: new Set(), started: false };

  function metaHtml(m) {
    return `${view.showChild && m.playerName ? `<span class="msg-child">${escapeHtml(m.playerName)}</span><span aria-hidden="true">·</span>` : ''}
      <time datetime="${escapeHtml(m.sentAt)}">${escapeHtml(when(m.sentAt))}</time>
      ${m.read ? '' : '<span class="msg-new">New</span>'}`;
  }
  function cardHtml(m) {
    return `<article class="msg-card${m.read ? '' : ' unread'}">
      <div class="msg-meta">${metaHtml(m)}</div>
      <p class="msg-body">${escapeHtml(m.body)}</p>
    </article>`;
  }
  function rowHtml(m) {
    const open = view.openRows.has(m.id);
    return `<div class="msg-row${open ? ' open' : ''}">
      <button type="button" class="msg-row-btn" data-row="${escapeHtml(m.id)}" aria-expanded="${open}">
        <span class="msg-row-text">
          <span class="msg-meta">${metaHtml(m)}</span>
          <span class="msg-row-preview">${escapeHtml(m.body)}</span>
        </span>
        ${CHEVRON}
      </button>
      <p class="msg-body msg-row-body">${escapeHtml(m.body)}</p>
    </div>`;
  }

  function renderMessages(messages, multipleChildren) {
    view.messages = messages;
    view.showChild = multipleChildren;
    // Older unread messages start opened, in an opened group.
    if (!view.started) {
      view.started = true;
      for (const g of groupMessages(messages).slice(1)) {
        if (!g.unread) continue;
        view.openGroups.add(g.id);
        g.messages.filter((m) => !m.read).forEach((m) => view.openRows.add(m.id));
      }
    }
    draw();
  }

  function draw() {
    const filterEl = document.getElementById('msg-filter');
    const listEl = document.getElementById('msg-list');
    const kids = childrenIn(view.messages);
    if (kids.length > 1) {
      if (view.child && !kids.includes(view.child)) view.child = '';
      filterEl.innerHTML = ['', ...kids].map((k) =>
        `<button type="button" class="msg-chip${view.child === k ? ' on' : ''}" data-child="${escapeHtml(k)}" aria-pressed="${view.child === k}">${k ? escapeHtml(k) : 'All'}</button>`).join('');
      filterEl.style.display = 'flex';
    } else {
      filterEl.style.display = 'none';
    }
    const groups = groupMessages(filterByChild(view.messages, view.child));
    listEl.innerHTML = groups.map((g, i) => {
      if (i === 0) {
        return `<section class="msg-group">
          <h2 class="msg-group-label">${escapeHtml(g.title)}</h2>
          <div class="msg-list">${g.messages.map(cardHtml).join('')}</div>
        </section>`;
      }
      const open = view.openGroups.has(g.id);
      const count = g.messages.length === 1 ? '1 message' : `${g.messages.length} messages`;
      return `<section class="msg-group">
        <button type="button" class="msg-fold${open ? ' open' : ''}" data-group="${escapeHtml(g.id)}" aria-expanded="${open}">
          <span class="msg-fold-title">${escapeHtml(g.title)}</span>
          <span class="msg-fold-count">${count}${g.unread ? ` · ${g.unread} new` : ''}</span>
          ${CHEVRON}
        </button>
        ${open ? `<div class="msg-rows">${g.messages.map(rowHtml).join('')}</div>` : ''}
      </section>`;
    }).join('') || '<p class="msg-empty">No messages about this child in the last 90 days.</p>';
    document.getElementById('msg-kept').style.display = 'block';
  }

  document.getElementById('msg-filter').addEventListener('click', (e) => {
    const b = e.target.closest('[data-child]');
    if (!b) return;
    view.child = b.dataset.child;
    draw();
  });
  document.getElementById('msg-list').addEventListener('click', (e) => {
    const g = e.target.closest('[data-group]');
    if (g) {
      const id = g.dataset.group;
      if (view.openGroups.has(id)) view.openGroups.delete(id); else view.openGroups.add(id);
      draw();
      document.querySelector(`[data-group="${CSS.escape(id)}"]`)?.focus();
      return;
    }
    const r = e.target.closest('[data-row]');
    if (r) {
      const id = r.dataset.row;
      const open = !view.openRows.has(id);
      if (open) view.openRows.add(id); else view.openRows.delete(id);
      r.parentElement.classList.toggle('open', open);
      r.setAttribute('aria-expanded', String(open));
    }
  });

  async function loadMessages(accessToken, uid) {
    const msgLoading = document.getElementById('msg-loading');
    const msgError = document.getElementById('msg-error');
    const msgEmpty = document.getElementById('msg-empty');
    const msgList = document.getElementById('msg-list');

    let body;
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/get-my-messages`, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      body = await res.json();
      if (!res.ok) throw new Error(body.error || 'Could not load messages');
    } catch (err) {
      msgLoading.style.display = 'none';
      msgError.textContent = 'Couldn’t load your messages. Check your connection and try again.';
      msgError.style.display = 'block';
      msgError.classList.add('visible');
      return;
    }
    msgLoading.style.display = 'none';

    if (!body.guardian) { window.location.replace('home.html'); return; }
    const messages = body.messages || [];
    if (messages.length === 0) {
      msgEmpty.style.display = 'block';
      markMessagesNavRead(uid);
      return;
    }

    renderMessages(messages, !!body.multipleChildren);
    // Mark what's now on screen as read. "New" stays visible until the
    // next visit, so it's clear which ones just arrived.
    const unreadIds = messages.filter((m) => !m.read).map((m) => m.id);
    if (unreadIds.length === 0) { markMessagesNavRead(uid); return; }
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/mark-messages-read`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: unreadIds }),
      });
      if (res.ok) markMessagesNavRead(uid);
    } catch {
      // Stays unread; tried again next visit.
    }
  }
</script>
</body>
</html>
