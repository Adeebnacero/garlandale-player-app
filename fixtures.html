<!DOCTYPE html>

  <script defer src="/_vercel/insights/script.js"></script>
<body class="home-page has-bottom-nav">

<div id="loading" class="loading-page">
  <div class="loader-emblem" aria-hidden="true"><img src="images/crest.png" alt="" width="48" height="56" /></div>
  <span data-loading-message>Checking your session…</span>
  <button type="button" class="loading-retry-btn" data-loading-retry>Try again</button>
</div>

<script>
  // Watchdog for the session check below: runs immediately, with no
  // imports and no network dependency of its own, so it can't get stuck
  // on the same thing the main module script might get stuck on. This
  // covers the case the getSessionOrTimeout() safety net in page-shared.js
  // can't: a full page reload (e.g. the OS discarded this tab while the
  // app was minimised, then reloaded it on return) where the ES module
  // imports themselves - fetched fresh over the network - are what hangs,
  // before any of our own code has had a chance to run.
  (function () {
    setTimeout(function () {
      var appEl = document.getElementById('app');
      var loadingEl = document.getElementById('loading');
      if (!loadingEl || (appEl && appEl.style.display !== 'none')) return;
      if (loadingEl.classList.contains('is-error')) return;
      var msg = loadingEl.querySelector('[data-loading-message]');
      if (msg) msg.textContent = "Couldn't check your session. Check your connection and try again.";
      loadingEl.classList.add('is-error');
      var retryBtn = loadingEl.querySelector('[data-loading-retry]');
      if (retryBtn) retryBtn.addEventListener('click', function () { window.location.reload(); });
    }, 10000);
  })();
</script>

<div id="app" style="display:none;">
  <header>
    <button class="menu-btn" id="menu-btn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <span class="header-center-title" id="header-brand"><img src="images/crest.png" alt="" style="width:22px; height:22px; vertical-align:-6px; margin-right:6px;" />Garlandale FC</span>
    <span style="width:22px"></span>
  </header>

  <div class="drawer-overlay" id="drawer-overlay">
    <div class="drawer-panel">
      <div class="drawer-header">
        <span>More options</span>
      </div>
      <a class="drawer-item" href="loyalty.html" data-loyalty-nav style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-4-6.3 4 1.7-7-5.4-4.7 7.1-.6z"/></svg>Loyalty</a>
      <button class="drawer-item" id="refresh-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg>Refresh now</button>
      <div class="drawer-divider"></div>
      <button class="drawer-item signout" id="logout-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button>
      <div class="drawer-footer">Built by www.atgeneral.co.za</div>
    </div>
  </div>

  <main>
    <p class="greeting">Upcoming</p>
    <h1 style="margin-bottom: 20px;">Fixtures</h1>

    <div class="child-tabs" id="child-tabs" style="display:none;"></div>

    <div id="fixtures-loading" style="color: var(--inkSoft); font-size: 14px;"><span class="spinner-inline" aria-hidden="true"></span>Loading fixtures…</div>
    <div id="fixtures-error" class="login-error" style="display:none;"></div>
    <div id="fixtures-empty" style="display:none; color: var(--inkSoft); font-size: 14px; text-align:center; padding: 24px 0;">
      No upcoming fixtures for your age group yet.
    </div>
    <div id="fixtures-list"></div>

    <p class="footnote">Showing fixtures for your age group.</p>
  </main>

  <nav class="bottom-nav">
    <a href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      <span>Home</span>
      <span class="nav-indicator"></span>
    </a>
    <a href="fixtures.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      <span>Fixtures</span>
      <span class="nav-indicator"></span>
    </a>
    <a href="notices.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M9.5 20a2.5 2.5 0 005 0"/></svg>
      <span class="nav-badge-dot" data-notice-badge style="display:none;"></span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>
      <span>Shop</span>
      <span class="nav-indicator"></span>
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Profile</span>
      <span class="nav-indicator"></span>
    </a>
  </nav>
</div>

<script type="module">
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
  import { cachedFetch } from './cache.js';
  import {
    setupDrawer, setupRefreshAndSignOut, registerServiceWorker,
    loadNoticeBadge, loadActiveStatus, escapeHtml, escapeAttr,
    safeMapsLink, locationButtonsHtml, locationMapBoxHtml, handleShowMapClick,
    loadMyPlayers, resolveSelectedPlayer, setSelectedPlayer, renderChildSwitcher,
    getSessionOrTimeout, showSessionCheckError,
    downloadFixtureICS,
    updateShopNav, setupNavigationFeedback, setupStickyHeader,
  } from './page-shared.js';

  const loading = document.getElementById('loading');
  const app = document.getElementById('app');

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    loading.textContent = 'This app has no Supabase connection configured yet.';
    throw new Error('Missing Supabase config');
  }

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let data;
  try {
    ({ data } = await getSessionOrTimeout(supabase));
  } catch (err) {
    showSessionCheckError(loading);
    throw err;
  }
  if (!data.session) {
    window.location.href = 'index.html';
  } else {
    loading.style.display = 'none';
    app.style.display = 'block';
    const uid = data.session.user.id;
    const accessToken = data.session.access_token;

    setupDrawer();
    setupRefreshAndSignOut(supabase, uid);
    registerServiceWorker();
    loadNoticeBadge(SUPABASE_URL, accessToken, uid);
    updateShopNav(SUPABASE_URL, accessToken, uid);
    setupNavigationFeedback();
    setupStickyHeader();

    let players = [];
    try {
      const playersBody = await loadMyPlayers(SUPABASE_URL, accessToken, uid);
      players = playersBody.players || [];
    } catch (err) {
      // Fall through - loadFixtures below still works for the common
      // single-child case even with an empty players list.
    }

    let selectedPlayerId = resolveSelectedPlayer(uid, players);

    const childTabs = document.getElementById('child-tabs');
    function onSelectChild(newPlayerId) {
      selectedPlayerId = newPlayerId;
      setSelectedPlayer(uid, selectedPlayerId);
      renderChildSwitcher(childTabs, players, selectedPlayerId, onSelectChild);
      loadActiveStatus(SUPABASE_URL, accessToken, uid, selectedPlayerId);
      loadFixtures(accessToken, uid, selectedPlayerId);
    }
    renderChildSwitcher(childTabs, players, selectedPlayerId, onSelectChild);

    loadActiveStatus(SUPABASE_URL, accessToken, uid, selectedPlayerId);
    loadFixtures(accessToken, uid, selectedPlayerId);
  }

  async function loadFixtures(accessToken, userId, playerId) {
    const fixturesLoading = document.getElementById('fixtures-loading');
    const fixturesError = document.getElementById('fixtures-error');
    const fixturesEmpty = document.getElementById('fixtures-empty');
    const fixturesList = document.getElementById('fixtures-list');

    fixturesLoading.style.display = 'block';
    fixturesError.classList.remove('visible');
    fixturesError.style.display = 'none';
    fixturesEmpty.style.display = 'none';
    fixturesList.innerHTML = '';

    try {
      const body = await cachedFetch(userId, `get-my-fixtures:${playerId}`, async () => {
        const res = await fetch(
          `${SUPABASE_URL}/functions/v1/get-my-fixtures?player_id=${encodeURIComponent(playerId)}`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Could not load fixtures');
        return json;
      });

      fixturesLoading.style.display = 'none';

      if (!body.fixtures || body.fixtures.length === 0) {
        fixturesEmpty.style.display = 'block';
        return;
      }

      const dateFmt = (d) =>
        new Date(d + 'T00:00:00').toLocaleDateString('en-ZA', {
          weekday: 'short', day: 'numeric', month: 'short',
        });
      const timeFmt = (t) => (t ? t.slice(0, 5) : '');

      fixturesList.innerHTML = body.fixtures
        .map((f, i) => {
          const isNext = i === 0;
          const homeAwayClass = f.home_away === 'H' ? ' is-home' : f.home_away === 'A' ? ' is-away' : '';
          // The venue name only becomes a link when staff added a
          // Directions link - never a guessed search.
          const directionsUrl = safeMapsLink(f.location_link);
          const venueHtml = directionsUrl && f.venue
            ? `<a class="venue-link" href="${escapeAttr(directionsUrl)}" target="_blank" rel="noopener">${escapeHtml(f.venue)}</a>`
            : escapeHtml(f.venue || 'TBC');
          const mapKey = `fixture-${i}`;
          return `
          <div class="card fixture-card${isNext ? ' next-fixture' : ''}${homeAwayClass}">
            ${isNext ? '<span class="next-fixture-badge">Next fixture</span>' : ''}
            <p class="fixture-teams">Garlandale FC vs ${escapeHtml(f.opponent || 'TBC')}</p>
            <p class="fixture-when" style="margin-top:4px;">Venue: ${venueHtml}${f.home_away ? ` (${f.home_away === 'H' ? 'Home' : 'Away'})` : ''}</p>
            <p class="fixture-when${isNext ? ' fixture-when-strong' : ''}" style="margin-top:4px;">Time: ${dateFmt(f.match_date)}${f.kickoff_time ? ' · ' + timeFmt(f.kickoff_time) : ''}</p>
            <p class="fixture-when" style="margin-top:8px; font-style: italic;">Please report 1 hour before kick-off</p>
            <div class="fixture-actions">
              <button type="button" class="add-to-calendar-btn" data-fixture-index="${i}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                Add to calendar
              </button>
              ${locationButtonsHtml(f, mapKey)}
            </div>
            ${locationMapBoxHtml(f, mapKey)}
          </div>
        `;
        })
        .join('');

      // Delegated click handler for the "Add to calendar" buttons - assigning
      // to onclick (rather than addEventListener) means re-running this
      // function (e.g. switching between children) replaces the previous
      // handler instead of stacking a duplicate on top of it.
      fixturesList.onclick = (e) => {
        if (handleShowMapClick(e, fixturesList)) return;
        const btn = e.target.closest('button.add-to-calendar-btn');
        if (!btn) return;
        const idx = Number(btn.getAttribute('data-fixture-index'));
        const fixture = body.fixtures[idx];
        if (fixture) downloadFixtureICS(fixture);
      };
    } catch (err) {
      fixturesLoading.style.display = 'none';
      fixturesError.textContent = err.message;
      fixturesError.classList.add('visible');
      fixturesError.style.display = 'block';
    }
  }

</script>

</body>
</html>
