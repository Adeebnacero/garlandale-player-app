# Supabase CLI settings for this repo's Edge Functions.
#
# Every function checks the caller's Supabase login (JWT) by default. Two
# exceptions, both called by machines that can't send a Supabase login:
#   - yoco-webhook: Yoco calls it directly. It proves who it is with Yoco's
#     own signature instead (checked in yoco-webhook/index.ts).
#   - send-notice-pushes: pg_cron calls it every hour. It proves who it is
#     with a shared secret from Vault (checked in its index.ts).
#
# Keeping this here means a plain `supabase functions deploy yoco-webhook`
# can never switch verification back on and silently stop payments being
# recorded (or notifications being sent).

project_id = "hfpmlrrunlttiekfdjdz"

[functions.yoco-webhook]
verify_jwt = false

[functions.send-notice-pushes]
verify_jwt = false
